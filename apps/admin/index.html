<!doctype html>
<html lang="zh-Hant-TW" data-lyds-theme="light">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="HUAN 讙 — 企業級雲端數位看板與媒體播放平台，支援影片、圖片、文字與網頁內容，並提供遠端素材管理、版面編排、排程發布、多裝置同步與離線播放能力。" />
		<link rel="icon" type="image/svg+xml" href="/logo.svg" />
		<title>HUAN 讙 — 雲端數位看板系統</title>
		<script>
			/* 主題必須在第一次繪製前決定，否則深色使用者會先看到一閃而過的亮色畫面。 */
			(function () {
				try {
					var stored = window.localStorage.getItem("huan.theme");
					var choice = stored === "light" || stored === "dark" ? stored : null;
					var system = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
					document.documentElement.dataset.lydsTheme = choice || system;
				} catch (error) {
					document.documentElement.dataset.lydsTheme = "light";
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
