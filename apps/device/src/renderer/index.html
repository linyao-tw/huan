<!doctype html>
<html lang="zh-TW" data-lyds-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!--
			播放器的 CSP。huan-media: 是主行程註冊的自訂協定，只讀得到媒體目錄裡的單一檔名；
			frame-src 允許 https 是因為版面可以放外部網址的 iframe。
		-->
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: huan-media:; media-src 'self' blob: huan-media:; font-src 'self' data:; connect-src 'self' huan-media:; frame-src https: huan-media:; object-src 'none'; base-uri 'none'"
		/>
		<title>HUAN 讙</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="./src/main.tsx"></script>
	</body>
</html>
