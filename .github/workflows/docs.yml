name: Docs

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/**"
      - ".github/workflows/docs.yml"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 建置文件
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages

      # 這一步需要 repository 已經在 Settings → Pages 把 Source 設成 GitHub Actions。
      # 不用 `enablement: true` 自動開啟：建立 Pages 站台需要 repository 的管理權限，
      # 而 GITHUB_TOKEN 沒有，結果只會是一句看不出原因的
      # 「Resource not accessible by integration」。
      - name: 設定 GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: 建置靜態網站
        run: pnpm docs:build
        env:
          # 站台服務在根路徑，因此不需要 base。
          # site 只影響 canonical、sitemap 與 llms.txt 的絕對連結，交給
          # configure-pages 回報比寫死可靠（換網域或改用 HTTPS 都會自動跟上）。
          DOCS_SITE_ORIGIN: ${{ steps.pages.outputs.origin }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/dist

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
