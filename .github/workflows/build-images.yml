name: 建置容器映像

# 正式環境（Zeabur）以預建映像部署，建置在 GitHub 原生 amd64 runner 上進行，
# 產物推到 GHCR。server 與 web 兩個映像都會在各自的 Dockerfile 內建置 Admin，
# 因此三個映像都帶著同一份 main 的內容。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "docker/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/build-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: docker/Dockerfile.server
          - name: worker
            dockerfile: docker/Dockerfile.worker
          - name: web
            dockerfile: docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Zeabur 的 OVH 專屬伺服器是 x86_64，只需要 amd64。
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/huan-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/huan-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=huan-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=huan-${{ matrix.name }}
