stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    # 14 天：夠追一週前的慢請求，又不會讓 trace 這種最佔空間的訊號無限長大。
    block_retention: 336h

# 從 trace 算出每一段的請求數、錯誤數與延遲分布，以及服務之間的呼叫圖，寫進 Prometheus。
# 「哪個 route 最慢」「錯誤率多少」不必另外在程式裡埋指標，也和 trace 永遠對得上。
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://huan-prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    # deployment.environment.name 是資源屬性，Tempo 也會去資源裡找；
    # 少了它，本機開發打過來的請求會和正式環境混在同一條線上。
    service_graphs:
      dimensions:
        - deployment.environment.name
    span_metrics:
      dimensions:
        - deployment.environment.name
        - http.route
        - http.request.method
        - http.response.status_code
        - huan.job.kind

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics, local-blocks]
