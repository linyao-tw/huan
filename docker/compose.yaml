name: huan

x-storage-env: &storage-env
  S3_ENDPOINT: http://rustfs:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-huan}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-huanadmin}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?請在 .env 設定 S3_SECRET_ACCESS_KEY}
  S3_FORCE_PATH_STYLE: "true"

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-huan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-huan}
    volumes:
      # PostgreSQL 18 起，官方映像把資料放進帶主版本號的子目錄，掛載點要是
      # /var/lib/postgresql 而不是它底下的 data。掛在舊位置會讓容器拒絕啟動，
      # 也讓之後的 pg_upgrade --link 跨不過掛載點邊界。
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-huan} -d ${POSTGRES_DB:-huan}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-huanadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?請在 .env 設定 S3_SECRET_ACCESS_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: huan/server:${HUAN_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      <<: *storage-env
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-huan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-huan}
      HOST: 0.0.0.0
      PORT: 4000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4000}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-huan_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-336}
      # 反向代理尚未接上 TLS 時，把這個設為 false 才收得到 cookie。
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # 要信任幾層反向代理。直接對外時保持 false；放在 Caddy 後面設為 1，
      # 否則速率限制會以代理的 IP 為鍵，被偽造的 X-Forwarded-For 繞過。
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TOTP_ISSUER: ${TOTP_ISSUER:-HUAN}
      # 加密 TOTP 密鑰用的金鑰（base64 的 32 bytes，openssl rand -base64 32）。
      # NODE_ENV=production 下沒有它 server 會拒絕啟動，因此設成必填。
      TOTP_SECRET_KEY: ${TOTP_SECRET_KEY:?請在 .env 設定 TOTP_SECRET_KEY（openssl rand -base64 32）}
      SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-900}
      DEVICE_HEARTBEAT_SECONDS: ${DEVICE_HEARTBEAT_SECONDS:-60}
      DEVICE_FALLBACK_SYNC_SECONDS: ${DEVICE_FALLBACK_SYNC_SECONDS:-300}
      DEVICE_MAX_CONCURRENT_DOWNLOADS: ${DEVICE_MAX_CONCURRENT_DOWNLOADS:-3}
      ADMIN_DIST_DIR: /app/apps/admin/dist
    ports:
      - "${SERVER_PORT:-4000}:4000"

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    image: huan/worker:${HUAN_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      <<: *storage-env
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-huan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-huan}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-2000}
      WORKER_JOB_MAX_ATTEMPTS: ${WORKER_JOB_MAX_ATTEMPTS:-3}
    volumes:
      # 轉檔暫存放在具名 volume，容器重啟時不會把大檔案留在 overlay 層。
      - worker-tmp:/var/tmp/huan

volumes:
  postgres-data:
  rustfs-data:
  worker-tmp:
